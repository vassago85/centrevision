; CentreVision production PHP tuning

; Memory & execution
memory_limit = 256M
max_execution_time = 60
max_input_time = 60

; Uploads (Livewire proofs, CSV imports)
upload_max_filesize = 20M
post_max_size = 20M
max_file_uploads = 20

; Errors — production. Laravel handles user-facing messages; PHP notices
; would only leak internals.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php/error.log
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Sessions
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1

; Hide PHP fingerprints
expose_php = Off
cgi.fix_pathinfo = 0

; OPcache — timestamps disabled because the image is rebuilt on every deploy,
; so nothing changes between restarts of the same container.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.save_comments = 1

date.timezone = Africa/Johannesburg
